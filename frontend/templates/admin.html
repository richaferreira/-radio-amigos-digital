arget="adsPane">Publicidade</button></li><li class="nav-item"><button class="nav-link" data-target="playerPane">Player / Streaming</button></li><li class="nav-item"><button class="nav-link" data-target="settingsPane">Configurações</button></li><li class="nav-item"><button class="nav-link" data-target="reportsPane">Relatórios</button></li></ul><div class="panel p-4"><div id="requestsPane" class="admin-pane"></div><div id="dedicationsPane" class="admin-pane d-none"></div><div id="programsPane" class="admin-pane d-none"></div><div id="chatPane" class="admin-pane d-none"></div><div id="usersPane" class="admin-pane d-none"></div><div id="pollPane" class="admin-pane d-none"></div><div id="mediaPane" class="admin-pane d-none"></div><div id="adsPane" class="admin-pane d-none"></div><div id="playerPane" class="admin-pane d-none"></div><div id="settingsPane" class="admin-pane d-none"></div><div id="reportsPane" class="admin-pane d-none"></div></div></div></div><div id="toast" class="toast-box"></div><script src="/static/js/admin.js"></script><script src="/static/js/admin-player.js"></script></body></html>
