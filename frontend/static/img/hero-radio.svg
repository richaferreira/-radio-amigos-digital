<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Mascote neon da Rádio Amigos Digital no ar">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff2d8d"/><stop offset=".48" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4b4a67"/><stop offset=".25" stop-color="#181522"/><stop offset=".65" stop-color="#2c2940"/><stop offset="1" stop-color="#090711"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#080713"/><stop offset=".45" stop-color="#140d26"/><stop offset="1" stop-color="#071522"/></linearGradient>
    <radialGradient id="bg"><stop stop-color="#23103c"/><stop offset=".52" stop-color="#10081d"/><stop offset="1" stop-color="#05030a"/></radialGradient>
    <radialGradient id="core"><stop stop-color="#15101f"/><stop offset=".62" stop-color="#080610"/><stop offset="1" stop-color="#020205"/></radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="28"/></filter>
    <style>
      #mascot{animation:float 5s ease-in-out infinite;transform-origin:450px 350px}
      #outerRing{animation:pulse 3.6s ease-in-out infinite;transform-origin:450px 332px}
      #dashRing{animation:spin 22s linear infinite;transform-origin:450px 332px}
      #playCore{animation:corePulse 1.8s ease-in-out infinite;transform-origin:450px 500px}
      #leftHand{animation:wave 3.2s ease-in-out infinite;transform-origin:265px 390px}
      #rightHand{animation:wave2 3.6s ease-in-out infinite;transform-origin:650px 405px}
      .bar{transform-box:fill-box;transform-origin:center bottom;animation:eq .8s ease-in-out infinite alternate}.bar:nth-child(2n){animation-duration:.56s}.bar:nth-child(3n){animation-duration:1s}
      .note{animation:note 3.2s ease-in-out infinite}.note.alt{animation-delay:-1.4s}
      @keyframes float{50%{transform:translateY(-8px)}}
      @keyframes pulse{50%{transform:scale(1.035);opacity:.9}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes corePulse{50%{transform:scale(1.045);filter:brightness(1.3)}}
      @keyframes wave{50%{transform:rotate(-4deg) translateY(-4px)}}
      @keyframes wave2{50%{transform:rotate(4deg) translateY(-3px)}}
      @keyframes eq{to{transform:scaleY(.35);opacity:.58}}
      @keyframes note{50%{transform:translateY(-13px);opacity:.68}}
    </style>
  </defs>

  <rect width="900" height="700" rx="36" fill="url(#bg)"/>
  <ellipse cx="450" cy="330" rx="360" ry="300" fill="#a855f7" opacity=".12" filter="url(#soft)"/>
  <circle id="outerRing" cx="450" cy="332" r="276" fill="none" stroke="url(#neon)" stroke-width="13" opacity=".72" filter="url(#glow)"/>
  <circle id="dashRing" cx="450" cy="332" r="240" fill="none" stroke="#22d3ee" stroke-opacity=".32" stroke-width="2" stroke-dasharray="7 17"/>
  <circle cx="450" cy="332" r="214" fill="none" stroke="#ff2d8d" stroke-opacity=".18" stroke-width="2"/>

  <g transform="translate(28 24)">
    <rect width="150" height="54" rx="17" fill="#100915" stroke="#ff2d8d" stroke-width="2" filter="url(#glow)"/>
    <circle cx="22" cy="27" r="6" fill="#ff2d8d"><animate attributeName="opacity" values="1;.35;1" dur="1.1s" repeatCount="indefinite"/></circle>
    <text x="43" y="35" fill="#fff" font-family="Arial,sans-serif" font-weight="900" font-size="24" letter-spacing="2">NO AR</text>
    <path d="M118 14q11-12 22 0M124 20q5-6 11 0" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  </g>

  <g opacity=".85">
    <g transform="translate(75 470)"><rect class="bar" x="0" y="65" width="10" height="70" rx="5" fill="#ff2d8d"/><rect class="bar" x="18" y="32" width="10" height="103" rx="5" fill="#a855f7"/><rect class="bar" x="36" y="82" width="10" height="53" rx="5" fill="#22d3ee"/><rect class="bar" x="54" y="48" width="10" height="87" rx="5" fill="#ff2d8d"/><rect class="bar" x="72" y="15" width="10" height="120" rx="5" fill="#22d3ee"/><rect class="bar" x="90" y="72" width="10" height="63" rx="5" fill="#a855f7"/></g>
    <g transform="translate(725 470)"><rect class="bar" x="0" y="44" width="10" height="91" rx="5" fill="#22d3ee"/><rect class="bar" x="18" y="80" width="10" height="55" rx="5" fill="#ff2d8d"/><rect class="bar" x="36" y="22" width="10" height="113" rx="5" fill="#a855f7"/><rect class="bar" x="54" y="60" width="10" height="75" rx="5" fill="#22d3ee"/><rect class="bar" x="72" y="35" width="10" height="100" rx="5" fill="#ff2d8d"/><rect class="bar" x="90" y="75" width="10" height="60" rx="5" fill="#a855f7"/></g>
  </g>

  <g class="note" fill="none" stroke="#ff55ad" stroke-width="7" stroke-linecap="round"><path d="M155 270v58c0 20-32 23-32 3 0-14 15-20 32-14"/><path d="M155 272l37-12v47c0 20-31 23-31 3 0-14 14-20 31-14"/></g>
  <g class="note alt" fill="none" stroke="#46e7ff" stroke-width="7" stroke-linecap="round"><path d="M742 244v56c0 20-31 23-31 3 0-14 14-20 31-14"/><path d="M742 246l35 12"/></g>

  <g id="mascot">
    <path d="M322 405c25-55 70-86 128-86s104 31 129 86l27 170H294z" fill="url(#metal)" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
    <path d="M337 416c33-33 69-50 113-50s82 17 113 50" fill="none" stroke="url(#neon)" stroke-width="8" opacity=".65" filter="url(#glow)"/>
    <path d="M365 376l-24 49 39 33 70-34 71 34 38-33-23-49" fill="#151221" stroke="#22d3ee" stroke-opacity=".42" stroke-width="3"/>

    <path d="M328 200c0-74 54-133 122-133s122 59 122 133v73c0 77-54 126-122 126s-122-49-122-126z" fill="url(#metal)" stroke="#fff" stroke-opacity=".12" stroke-width="4"/>
    <path d="M350 199c10-58 47-92 100-92s91 34 101 92v77c-12 59-49 89-101 89s-89-30-100-89z" fill="url(#visor)" stroke="url(#neon)" stroke-width="5" filter="url(#glow)"/>
    <path d="M374 204q32-30 64 0" fill="none" stroke="#4ee9ff" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M462 204q32-30 64 0" fill="none" stroke="#4ee9ff" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M397 286q53 51 106 0" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
    <g opacity=".85"><rect x="376" y="238" width="7" height="35" rx="3" fill="#ff2d8d"/><rect x="388" y="230" width="7" height="43" rx="3" fill="#a855f7"/><rect x="400" y="244" width="7" height="29" rx="3" fill="#22d3ee"/><rect x="493" y="239" width="7" height="34" rx="3" fill="#22d3ee"/><rect x="505" y="228" width="7" height="45" rx="3" fill="#a855f7"/><rect x="517" y="245" width="7" height="28" rx="3" fill="#ff2d8d"/></g>

    <path d="M320 201c8-95 62-157 130-157s123 62 131 157" fill="none" stroke="#2c293a" stroke-width="32" stroke-linecap="round"/>
    <path d="M320 201c8-95 62-157 130-157s123 62 131 157" fill="none" stroke="url(#neon)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
    <g transform="translate(296 191)"><rect width="55" height="121" rx="25" fill="#0a0810" stroke="url(#neon)" stroke-width="7"/><rect x="15" y="20" width="10" height="81" rx="5" fill="#ff2d8d"/><rect x="31" y="20" width="10" height="81" rx="5" fill="#22d3ee"/></g>
    <g transform="translate(549 191)"><rect width="55" height="121" rx="25" fill="#0a0810" stroke="url(#neon)" stroke-width="7"/><rect x="15" y="20" width="10" height="81" rx="5" fill="#ff2d8d"/><rect x="31" y="20" width="10" height="81" rx="5" fill="#22d3ee"/></g>

    <g id="leftHand"><path d="M335 424c-45-18-85-58-115-101-11-16-31-17-42-5-11 13-7 31 5 43 37 41 71 87 128 115" fill="url(#metal)" stroke="#a855f7" stroke-width="5"/><path d="M181 327l-25-35c-8-12-27-7-27 8 0 7 4 14 10 20l26 28" fill="url(#metal)" stroke="#22d3ee" stroke-width="5"/><path d="M170 324l-5-55c-1-15-21-18-27-4-3 6-2 14 1 21l10 49" fill="url(#metal)" stroke="#ff2d8d" stroke-width="5"/></g>
    <g id="rightHand"><path d="M566 432c49-11 85-42 126-77 15-13 35-10 43 5 8 14 1 31-12 42-43 36-83 72-145 84" fill="url(#metal)" stroke="#22d3ee" stroke-width="5"/><path d="M707 360l32-29c11-10 28-2 25 13-2 8-7 14-14 18l-33 24" fill="url(#metal)" stroke="#a855f7" stroke-width="5"/><path d="M695 349l17-43c5-14 25-13 28 2 2 8-1 15-6 21l-24 35" fill="url(#metal)" stroke="#ff2d8d" stroke-width="5"/></g>

    <g id="playCore">
      <circle cx="450" cy="500" r="105" fill="url(#core)" stroke="#302b43" stroke-width="20"/>
      <circle cx="450" cy="500" r="92" fill="none" stroke="url(#neon)" stroke-width="9" filter="url(#glow)"/>
      <circle cx="450" cy="500" r="69" fill="#080610" stroke="#fff" stroke-opacity=".13" stroke-width="3"/>
      <path d="M427 461l72 39-72 40z" fill="#fff" stroke="#ff2d8d" stroke-width="5" filter="url(#glow)"/>
    </g>
    <path d="M418 405h64l17 36-49 22-49-22z" fill="#100c19" stroke="#22d3ee" stroke-width="3"/><path d="M418 432h13v14h-13zm25-12h13v26h-13zm25 7h13v19h-13z" fill="url(#neon)"/>
  </g>

  <ellipse cx="450" cy="622" rx="260" ry="44" fill="#a855f7" opacity=".14" filter="url(#soft)"/>
  <ellipse cx="450" cy="622" rx="246" ry="37" fill="none" stroke="url(#neon)" stroke-width="4" opacity=".42" filter="url(#glow)"/>
</svg>
