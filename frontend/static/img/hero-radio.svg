<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" role="img" aria-label="Mascote neon da Rádio Amigos Digital no ar">
  <defs>
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".11"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".12"/><stop offset=".55" stop-color="#a855f7" stop-opacity=".08"/><stop offset="1" stop-color="#ff2d8d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="760" height="570" rx="30" fill="#06030d"/>
  <image x="0" y="0" width="760" height="570" preserveAspectRatio="xMidYMid slice" href="data:image/webp;base64,[... truncated base64 for brevity ...]AA="/>
  <circle cx="380" cy="285" r="205" fill="none" stroke="#ff2d8d" stroke-opacity=".16" stroke-width="2.5" filter="url(#heroGlow)"><animate attributeName="r" values="196;212;196" dur="4.2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".10;.28;.10" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="380" cy="285" r="166" fill="none" stroke="#22d3ee" stroke-opacity=".12" stroke-width="2" stroke-dasharray="5 13"><animateTransform attributeName="transform" type="rotate" from="0 380 285" to="360 380 285" dur="22s" repeatCount="indefinite"/></circle>
  <ellipse cx="380" cy="292" rx="272" ry="222" fill="url(#pulse)" opacity=".24"><animate attributeName="opacity" values=".14;.32;.14" dur="3.6s" repeatCount="indefinite"/></ellipse>
  <rect x="-230" y="0" width="180" height="570" fill="url(#scan)" opacity=".48" transform="skewX(-16)"><animate attributeName="x" values="-230;900" dur="8s" repeatCount="indefinite"/></rect>
</svg>