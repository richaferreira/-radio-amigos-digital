<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 315" role="img" aria-label="Mascote neon da Rádio Amigos Digital no ar">
  <defs>
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".12"/><stop offset=".55" stop-color="#a855f7" stop-opacity=".08"/><stop offset="1" stop-color="#ff2d8d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="420" height="315" rx="20" fill="#06030d"/>
  <image x="0" y="0" width="420" height="315" preserveAspectRatio="xMidYMid slice" href="data:image/webp;base64,[...truncated...]AA=="/>
  <circle cx="210" cy="157.5" r="145" fill="none" stroke="#ff2d8d" stroke-opacity=".15" stroke-width="2" filter="url(#heroGlow)"><animate attributeName="r" values="138;150;138" dur="4.2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".08;.26;.08" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="210" cy="157.5" r="116" fill="none" stroke="#22d3ee" stroke-opacity=".14" stroke-width="1.7" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0 210 157.5" to="360 210 157.5" dur="22s" repeatCount="indefinite"/></circle>
  <ellipse cx="210" cy="160" rx="184" ry="148" fill="url(#pulse)" opacity=".22"><animate attributeName="opacity" values=".12;.31;.12" dur="3.6s" repeatCount="indefinite"/></ellipse>
  <rect x="-130" y="0" width="100" height="315" fill="url(#scan)" opacity=".46" transform="skewX(-16)"><animate attributeName="x" values="-130;500" dur="8s" repeatCount="indefinite"/></rect>
