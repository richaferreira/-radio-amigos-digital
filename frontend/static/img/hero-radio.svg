<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="Robô DJ cibernético realista da Rádio Amigos Digital">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop stop-color="#18102f"/><stop offset=".46" stop-color="#090719"/><stop offset="1" stop-color="#020207"/></radialGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff2d8d"/><stop offset=".48" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67718a"/><stop offset=".15" stop-color="#20283a"/><stop offset=".38" stop-color="#0b0f1b"/><stop offset=".62" stop-color="#35415b"/><stop offset=".82" stop-color="#101522"/><stop offset="1" stop-color="#6c7894"/></linearGradient>
  <linearGradient id="metal2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5d6980"/><stop offset=".2" stop-color="#171d2b"/><stop offset=".65" stop-color="#070a12"/><stop offset="1" stop-color="#2d3850"/></linearGradient>
  <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08101c"/><stop offset=".45" stop-color="#02050c"/><stop offset=".7" stop-color="#10152a"/><stop offset="1" stop-color="#02030a"/></linearGradient>
  <radialGradient id="core" cx="48%" cy="38%"><stop stop-color="#273254"/><stop offset=".4" stop-color="#101426"/><stop offset=".8" stop-color="#04050a"/><stop offset="1" stop-color="#010103"/></radialGradient>
  <radialGradient id="deck" cx="50%" cy="45%"><stop stop-color="#25233a"/><stop offset=".58" stop-color="#090913"/><stop offset="1" stop-color="#020205"/></radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="32"/></filter>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".6"/></filter>
  <style>
   #robot{animation:float 5.8s ease-in-out infinite;transform-origin:450px 430px}
   #halo1{animation:pulse 4s ease-in-out infinite;transform-origin:450px 375px}
   #halo2{animation:spin 27s linear infinite;transform-origin:450px 375px}
   #coreRing{animation:core 2.1s ease-in-out infinite;transform-origin:450px 505px}
   .eq{transform-box:fill-box;transform-origin:center bottom;animation:eq .8s ease-in-out infinite alternate}.eq:nth-child(2n){animation-duration:.55s}.eq:nth-child(3n){animation-duration:1.05s}
   .note{animation:note 3.4s ease-in-out infinite}.note.b{animation-delay:-1.7s}
   @keyframes float{50%{transform:translateY(-7px)}}@keyframes pulse{50%{transform:scale(1.018);opacity:.88}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes core{50%{transform:scale(1.035);filter:brightness(1.25)}}@keyframes eq{to{transform:scaleY(.32);opacity:.58}}@keyframes note{50%{transform:translateY(-12px);opacity:.7}}
   @media(prefers-reduced-motion:reduce){#robot,#halo1,#halo2,#coreRing,.eq,.note{animation:none}}
  </style>
</defs>
