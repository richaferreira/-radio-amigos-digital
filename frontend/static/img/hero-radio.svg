<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Mascote neon premium da Rádio Amigos Digital">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff2d8d"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4a4967"/><stop offset=".18" stop-color="#191625"/><stop offset=".52" stop-color="#29263a"/><stop offset="1" stop-color="#07060d"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a1630"/><stop offset=".45" stop-color="#070611"/><stop offset="1" stop-color="#071421"/></linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%"><stop stop-color="#1b0d31"/><stop offset=".58" stop-color="#0c0617"/><stop offset="1" stop-color="#030207"/></radialGradient>
    <radialGradient id="core" cx="48%" cy="40%"><stop stop-color="#292141"/><stop offset=".48" stop-color="#0e0b18"/><stop offset="1" stop-color="#030207"/></radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="28"/></filter>
    <style>
      #mascot{animation:float 5s ease-in-out infinite;transform-origin:450px 330px}
      #halo{animation:pulse 3.4s ease-in-out infinite;transform-origin:450px 320px}
      #dash{animation:spin 24s linear infinite;transform-origin:450px 320px}
      #coreRing{animation:corePulse 2s ease-in-out infinite;transform-origin:450px 350px}
      .eq{transform-box:fill-box;transform-origin:center bottom;animation:eq .85s ease-in-out infinite alternate}.eq:nth-child(2n){animation-duration:.55s}.eq:nth-child(3n){animation-duration:1.05s}
      .note{animation:note 3.2s ease-in-out infinite}.note.alt{animation-delay:-1.5s}
      @keyframes float{50%{transform:translateY(-8px)}}
      @keyframes pulse{50%{transform:scale(1.025);opacity:.92}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes corePulse{50%{transform:scale(1.035);filter:brightness(1.28)}}
      @keyframes eq{to{transform:scaleY(.4);opacity:.65}}
      @keyframes note{50%{transform:translateY(-12px);opacity:.68}}
    </style>
  </defs>

  <rect width="900" height="700" rx="34" fill="url(#bg)"/>
  <ellipse cx="450" cy="320" rx="340" ry="285" fill="#a855f7" opacity=".11" filter="url(#soft)"/>
  <circle id="halo" cx="450" cy="320" r="255" fill="none" stroke="url(#neon)" stroke-width="13" opacity=".78" filter="url(#glow)"/>
  <circle id="dash" cx="450" cy="320" r="222" fill="none" stroke="#22d3ee" stroke-opacity=".30" stroke-width="2" stroke-dasharray="7 16"/>
  <circle cx="450" cy="320" r="194" fill="none" stroke="#ff2d8d" stroke-opacity=".16" stroke-width="2"/>

  <g opacity=".92">
    <g transform="translate(72 440)">
      <rect class="eq" x="0" y="46" width="11" height="88" rx="5" fill="#ff2d8d"/><rect class="eq" x="20" y="18" width="11" height="116" rx="5" fill="#a855f7"/><rect class="eq" x="40" y="62" width="11" height="72" rx="5" fill="#6d5cff"/><rect class="eq" x="60" y="4" width="11" height="130" rx="5" fill="#22d3ee"/><rect class="eq" x="80" y="36" width="11" height="98" rx="5" fill="#ff2d8d"/><rect class="eq" x="100" y="72" width="11" height="62" rx="5" fill="#7c5cff"/>
    </g>
    <g transform="translate(706 440)">
      <rect class="eq" x="0" y="70" width="11" height="64" rx="5" fill="#22d3ee"/><rect class="eq" x="20" y="26" width="11" height="108" rx="5" fill="#7c5cff"/><rect class="eq" x="40" y="5" width="11" height="129" rx="5" fill="#ff2d8d"/><rect class="eq" x="60" y="48" width="11" height="86" rx="5" fill="#a855f7"/><rect class="eq" x="80" y="20" width="11" height="114" rx="5" fill="#22d3ee"/><rect class="eq" x="100" y="76" width="11" height="58" rx="5" fill="#ff2d8d"/>
    </g>
  </g>

  <g class="note" transform="translate(170 245) rotate(-12)" fill="none" stroke="#ff55a6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><path d="M34 2v60c0 17-30 24-39 7-8-16 12-31 39-23"/><path d="M34 8l38-10v49c0 17-30 24-39 7-7-15 12-29 39-22"/></g>
  <g class="note alt" transform="translate(708 230)" fill="none" stroke="#34def6" stroke-width="8" stroke-linecap="round" filter="url(#glow)"><path d="M0 0v64c0 18-31 25-40 7-8-16 12-31 40-23"/><path d="M0 4l40-12"/></g>

  <g id="mascot">
    <path d="M312 262c6-112 65-185 138-185s132 73 138 185" fill="none" stroke="#252034" stroke-width="42" stroke-linecap="round"/>
    <path d="M312 262c6-112 65-185 138-185s132 73 138 185" fill="none" stroke="url(#neon)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

    <rect x="273" y="236" width="82" height="156" rx="38" fill="#06050b" stroke="url(#neon)" stroke-width="8"/>
    <rect x="545" y="236" width="82" height="156" rx="38" fill="#06050b" stroke="url(#neon)" stroke-width="8"/>
    <rect x="294" y="267" width="11" height="95" rx="5" fill="#ff2d8d"/><rect x="318" y="267" width="11" height="95" rx="5" fill="#22d3ee"/>
    <rect x="566" y="267" width="11" height="95" rx="5" fill="#ff2d8d"/><rect x="590" y="267" width="11" height="95" rx="5" fill="#22d3ee"/>

    <path d="M342 154c18-57 55-88 108-88s90 31 108 88l17 143c-11 81-52 122-125 122s-114-41-125-122z" fill="url(#metal)" stroke="#fff" stroke-opacity=".10" stroke-width="3"/>
    <path d="M356 173c15-43 47-67 94-67s79 24 94 67l10 112c-10 62-43 94-104 94s-94-32-104-94z" fill="url(#visor)" stroke="url(#neon)" stroke-width="5" filter="url(#glow)"/>
    <path d="M381 236q34-36 68 0" fill="none" stroke="#48e7ff" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M451 236q34-36 68 0" fill="none" stroke="#48e7ff" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M403 300q47 36 94 0" fill="none" stroke="#f7f5ff" stroke-width="8" stroke-linecap="round" opacity=".88" filter="url(#glow)"/>

    <path d="M342 376c25 27 60 41 108 41s83-14 108-41l61 194H281z" fill="url(#metal)" stroke="#fff" stroke-opacity=".09" stroke-width="3"/>
    <path d="M328 444q122 64 244 0" fill="none" stroke="url(#neon)" stroke-width="5" opacity=".55"/>

    <circle id="coreRing" cx="450" cy="350" r="90" fill="url(#core)" stroke="url(#neon)" stroke-width="9" filter="url(#glow)"/>
    <circle cx="450" cy="350" r="67" fill="#06050b" stroke="#fff" stroke-opacity=".13" stroke-width="2"/>
    <circle cx="450" cy="350" r="52" fill="none" stroke="#a855f7" stroke-opacity=".25" stroke-width="2" stroke-dasharray="4 8"/>
  </g>

  <ellipse cx="450" cy="590" rx="275" ry="46" fill="#07050d" stroke="url(#neon)" stroke-width="4" opacity=".9" filter="url(#glow)"/>
  <ellipse cx="450" cy="590" rx="205" ry="23" fill="#a855f7" opacity=".13" filter="url(#soft)"/>
</svg>